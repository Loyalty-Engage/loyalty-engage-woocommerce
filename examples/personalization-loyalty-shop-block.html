<!--
  Static Loyalty Engage test block for WooCommerce.
  Replace TEST-GIFTCARD-SKU and TEST-PHYSICAL-SKU with existing Loyalty Engage reward SKUs.
-->
<section class="sg-shop" id="loyalty-shop" data-lew-personalization-shop data-lew-debug="true" data-cart-subtotal="0">
  <div class="sg-shop-head">
    <div>
      <span class="sg-shop-kicker">Shogun Rewards</span>
      <h2 class="sg-display">Wissel je tegoed in</h2>
      <p>Testweergave met een cadeaukaart en een fysiek product.</p>
    </div>
  </div>

  <div class="sg-shop-grid">
    <article class="sg-shop-card" data-lew-reward data-lew-type="discount_code" data-lew-sku="TEST-GIFTCARD-SKU">
      <div class="sg-shop-image">
        <strong>&euro; 10</strong>
      </div>
      <div class="sg-shop-body">
        <span>500 coins</span>
        <h3>&euro;10 cadeaukaart</h3>
        <small>Digitale reward</small>
        <button type="button" class="sg-btn sg-btn-yellow" data-lew-action="discount" data-lew-sku="TEST-GIFTCARD-SKU">
          Cadeaukaart claimen <span class="sg-arrow">&rarr;</span>
        </button>
      </div>
    </article>

    <article class="sg-shop-card" data-lew-reward data-lew-type="physical" data-lew-sku="TEST-PHYSICAL-SKU">
      <div class="sg-shop-image">
        <strong>REWARD</strong>
      </div>
      <div class="sg-shop-body">
        <span>750 coins</span>
        <h3>Fysiek testproduct</h3>
        <small>Wordt gratis aan de WooCommerce-winkelmand toegevoegd</small>
        <button type="button" class="sg-btn sg-btn-yellow" data-lew-action="physical" data-lew-sku="TEST-PHYSICAL-SKU">
          Toevoegen aan winkelmand <span class="sg-arrow">&rarr;</span>
        </button>
      </div>
    </article>
  </div>

  <div class="sg-shop-message" data-lew-message role="status" aria-live="polite"></div>
</section>

<script>
(function () {
  'use strict';

  var root = document.querySelector('[data-lew-personalization-shop]');
  if (!root || root.dataset.lewBound === 'true') return;
  root.dataset.lewBound = 'true';

  var message = root.querySelector('[data-lew-message]');
  var debugEnabled = root.dataset.lewDebug === 'true';

  function debug(eventName, details) {
    if (!debugEnabled || !window.console) return;
    console.log('[Loyalty Engage] ' + eventName, details || {});
  }

  function summarizeResponse(data) {
    data = data || {};
    return {
      success: data.success,
      message: data.message || '',
      couponApplied: data.couponApplied,
      couponPending: data.couponPending,
      hasDiscountCode: Boolean(data.discountCode || data.discount_code),
      hasCartUrl: Boolean(data.cartUrl),
      hasCheckoutUrl: Boolean(data.checkoutUrl)
    };
  }

  function notify(text, success) {
    if (!message) return;
    message.textContent = text || '';
    message.classList.toggle('is-success', Boolean(success));
    message.classList.toggle('is-error', !success);
  }

  function getConfig() {
    return window.lewWooCommerce || {};
  }

  function getError(result, fallback) {
    if (result && result.message) return result.message;
    if (result && result.data && result.data.message) return result.data.message;
    return fallback;
  }

  function restoreButton(button, label) {
    button.disabled = false;
    button.innerHTML = label;
  }

  var initialConfig = getConfig();
  debug('initialized', {
    restBase: initialConfig.restBase || '',
    loggedIn: Boolean(initialConfig.loggedIn),
    customerId: initialConfig.customerId || 0,
    hasNonce: Boolean(initialConfig.nonce),
    rewardButtons: root.querySelectorAll('[data-lew-action]').length
  });

  root.addEventListener('click', function (event) {
    var button = event.target.closest('[data-lew-action]');
    if (!button || !root.contains(button)) return;

    event.preventDefault();

    var config = getConfig();
    debug('reward clicked', {
      action: button.dataset.lewAction || '',
      sku: button.dataset.lewSku || '',
      loggedIn: Boolean(config.loggedIn),
      customerId: config.customerId || 0
    });

    if (!config.loggedIn || !config.customerId) {
      debug('redirecting to login', { loginUrl: config.loginUrl || '/my-account/' });
      window.location.href = config.loginUrl || '/my-account/';
      return;
    }

    if (!config.restBase || !config.nonce) {
      debug('configuration missing', {
        hasRestBase: Boolean(config.restBase),
        hasNonce: Boolean(config.nonce)
      });
      notify('De WooCommerce-koppeling is nog niet geladen. Vernieuw de pagina en probeer opnieuw.', false);
      return;
    }

    var sku = button.dataset.lewSku || '';
    var action = button.dataset.lewAction;
    if (!sku || (action !== 'discount' && action !== 'physical')) {
      debug('invalid reward configuration', { action: action, sku: sku });
      notify('Deze reward mist een geldig type of SKU.', false);
      return;
    }

    var originalLabel = button.innerHTML;
    var endpoint = action === 'discount' ? '/discount/' : '/physical-redeem/';
    var url = config.restBase.replace(/\/$/, '') + endpoint + encodeURIComponent(sku) + '/' + encodeURIComponent(config.customerId);
    var body = {
      cartSubtotal: Number(root.dataset.cartSubtotal || 0)
    };

    button.disabled = true;
    button.textContent = 'Bezig...';
    notify('', true);
    debug('request started', {
      action: action,
      sku: sku,
      endpoint: endpoint,
      cartSubtotal: body.cartSubtotal
    });

    fetch(url, {
      method: 'POST',
      credentials: 'same-origin',
      headers: {
        'Content-Type': 'application/json',
        'X-WP-Nonce': config.nonce
      },
      body: JSON.stringify(body)
    }).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (data) {
        debug('response received', {
          httpStatus: response.status,
          ok: response.ok,
          response: summarizeResponse(data)
        });
        if (!response.ok || data.success === false) {
          throw data;
        }
        return data;
      });
    }).then(function (data) {
      if (action === 'discount') {
        var code = data.discountCode || data.discount_code || '';
        button.textContent = code ? 'Code: ' + code : 'Cadeaukaart geactiveerd';
        if (data.couponApplied) {
          notify(code ? 'Cadeaukaart geactiveerd en toegepast: ' + code : 'Cadeaukaart geactiveerd en toegepast.', true);
        } else {
          notify('Cadeaukaart geactiveerd. De korting wordt automatisch toegepast zodra je een product toevoegt.', true);
        }
        debug('discount completed', summarizeResponse(data));
        window.setTimeout(function () {
          debug('redirecting to cart', { cartUrl: config.cartUrl || '/cart/' });
          window.location.href = config.cartUrl || '/cart/';
        }, 900);
        return;
      }

      button.textContent = 'Toegevoegd';
      notify('Reward is gereserveerd en toegevoegd aan je winkelmand.', true);
      debug('physical reward completed', summarizeResponse(data));
      window.setTimeout(function () {
        debug('redirecting to cart', { cartUrl: data.cartUrl || config.cartUrl || '/cart/' });
        window.location.href = data.cartUrl || config.cartUrl || '/cart/';
      }, 900);
    }).catch(function (error) {
      debug('request failed', summarizeResponse(error));
      restoreButton(button, originalLabel);
      notify(getError(error, 'De reward kon niet worden verwerkt. Probeer het opnieuw.'), false);
    });
  });
})();
</script>
