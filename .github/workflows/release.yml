name: Release WordPress plugin

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          plugin_version="$(sed -n "s/define('LEW_PLUGIN_VERSION', '\([^']*\)').*/\1/p" loyalty-engage-woocommerce.php)"
          tag_version="${GITHUB_REF_NAME#v}"
          test -n "$plugin_version"
          test "$plugin_version" = "$tag_version"
          header_version="$(sed -n 's/^ \* Version: //p' loyalty-engage-woocommerce.php)"
          test "$header_version" = "$plugin_version"

      - name: Run release checks
        shell: bash
        run: |
          set -euo pipefail
          php -l loyalty-engage-woocommerce.php
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find includes tests -name '*.php' -print0)
          for test in tests/*.php; do php "$test"; done
          for script in assets/js/*.js; do node --check "$script"; done
          node --test tests/*.test.cjs
          git diff --check

      - name: Build installable plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/loyalty-engage-woocommerce
          cp loyalty-engage-woocommerce.php README.md dist/loyalty-engage-woocommerce/
          cp -R assets includes dist/loyalty-engage-woocommerce/
          cd dist
          zip -r ../loyalty-engage-woocommerce.zip loyalty-engage-woocommerce

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            loyalty-engage-woocommerce.zip \
            --verify-tag \
            --title "Loyalty Engage for WooCommerce ${GITHUB_REF_NAME#v}" \
            --generate-notes
